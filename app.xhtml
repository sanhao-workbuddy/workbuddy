<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>三好工作台</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="icon-192.png" />
  <style type="text/css">
    body { background: #FAF6EF; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: -apple-system, sans-serif; }
    .loader { text-align: center; color: #D97757; }
    .spinner { width: 40px; height: 40px; border: 3px solid #E8DDD0; border-top-color: #D97757; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { margin: 0; font-size: 1rem; }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p>正在加载工作台...</p>
  </div>
  <script type="text/javascript">
    //<![CDATA[
    // 入口页：注册 Service Worker 后跳转到主页面
    // jsdelivr CDN 把 .html 当 text/plain 返回，SW 拦截后修复为 text/html
    // PWA 从主屏幕启动时必须先走此入口页（manifest start_url = app.xhtml）
    var redirected = false;
    function go() {
      if (redirected) return;
      redirected = true;
      location.replace('工作台.html');
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(function() {
        return navigator.serviceWorker.ready;
      }).then(function() {
        go();
      }).catch(function() {
        go();
      });
      // 超时保护：SW 注册超过 8 秒还没 ready 就直接跳
      setTimeout(go, 8000);
    } else {
      go();
    }
    //]]>
  </script>
</body>
</html>
