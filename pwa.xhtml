<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>三好工作台</title>
  <link rel="manifest" href="pwa-manifest.json?v=3" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="icon-192.png" />
  <style type="text/css">
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #FAF6EF; font-family: -apple-system, sans-serif; }
    #loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #FAF6EF; z-index: 9999; }
    .loader-inner { text-align: center; color: #D97757; }
    .spinner { width: 40px; height: 40px; border: 3px solid #E8DDD0; border-top-color: #D97757; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { margin: 0; font-size: 1rem; }
    iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <div id="loader">
    <div class="loader-inner">
      <div class="spinner"></div>
      <p>正在加载工作台...</p>
    </div>
  </div>
  <script type="text/javascript">
    //<![CDATA[
    // PWA 入口页 v3：用 iframe + srcdoc 绕过 jsdelivr 把 .html 当 text/plain 返回的问题
    // 不再依赖 Service Worker 修复 content-type，SW 仅用于缓存与离线加速
    var MAIN = '工作台.html';
    var loaded = false;

    function injectHtml(html) {
      if (loaded) return;
      loaded = true;
      var loader = document.getElementById('loader');
      if (loader) loader.remove();

      var iframe = document.createElementNS('http://www.w3.org/1999/xhtml', 'iframe');
      iframe.setAttribute('style', 'position:fixed;top:0;left:0;width:100%;height:100%;border:0;');
      // 不设置 sandbox，保证内部脚本、Service Worker 能正常工作
      iframe.srcdoc = html;
      document.body.appendChild(iframe);
    }

    function showError() {
      var p = document.querySelector('#loader p');
      if (p) p.textContent = '加载失败，请检查网络后重新打开';
    }

    function loadMain() {
      if (loaded) return;
      fetch(MAIN)
        .then(function(r) { return r.text(); })
        .then(function(html) {
          if (!html || html.trim().length < 200) throw new Error('empty');
          injectHtml(html);
        })
        .catch(function(err) {
          console.error('loadMain failed', err);
          showError();
        });
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('pwa-sw.js?v=3')
        .then(function() { return navigator.serviceWorker.ready; })
        .then(function() { loadMain(); })
        .catch(function() { loadMain(); });
      // 8 秒超时保护：SW 一直未 ready 也直接加载
      setTimeout(loadMain, 8000);
    } else {
      loadMain();
    }
    //]]>
  </script>
</body>
</html>
